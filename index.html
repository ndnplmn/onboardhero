<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>OnboardHero — Intelligent Onboarding Platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f9f8f0;--surface:#FFFFFF;--surface-2:#F2F1EA;
  --primary:#1a2e2e;--accent:#5fb3af;--accent-light:#e6f5f4;
  --accent-warm:#fda55d;--accent-warm-light:#FFF3E8;
  --accent-yellow:#ffde59;--accent-green:#d0ce4e;--accent-yellow:#ffde59;
  --muted:#7a8c8b;--border:#DDE8E7;
  --success:#5fb3af;--success-light:#e6f5f4;
  --warning:#fda55d;--warning-light:#FFF3E8;--danger:#e05c5c;
  --font-d:'Montserrat',system-ui,sans-serif;
  --font-ui:'Montserrat',system-ui,sans-serif;
  --shadow-sm:0 1px 3px rgba(15,15,35,.06),0 1px 2px rgba(15,15,35,.04);
  --shadow-md:0 4px 16px rgba(15,15,35,.08),0 2px 6px rgba(15,15,35,.04);
  --r:14px;
}
body{font-family:var(--font-ui);background:var(--bg);color:var(--primary);min-height:100vh}
*{scrollbar-width:thin;scrollbar-color:var(--border) transparent}
*::-webkit-scrollbar{width:4px}*::-webkit-scrollbar-thumb{background:var(--border);border-radius:999px}

/* Layout */
#app{display:flex;min-height:100vh}
#sidebar{width:240px;min-height:100vh;background:var(--surface);border-right:1.5px solid var(--border);display:flex;flex-direction:column;padding:24px 16px;flex-shrink:0;position:sticky;top:0;height:100vh;overflow-y:auto}
#main{flex:1;padding:32px 36px;overflow-x:hidden;padding-bottom:80px;max-width:100%}

/* Logo */
.logo-wrap{display:flex;align-items:center;gap:10px;padding:4px 6px;margin-bottom:32px}
.logo-icon{width:32px;height:32px;border-radius:10px;background:var(--primary);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.logo-text{font-family:var(--font-ui);font-size:18px;font-weight:700;letter-spacing:-.3px;color:var(--primary)}

/* Profile card */
.profile-card{padding:14px;background:var(--bg);border-radius:12px;margin-bottom:28px;border:1.5px solid var(--border)}
.profile-top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.profile-meta{font-size:11px;color:var(--muted);line-height:1.3}
.profile-name{font-size:13px;font-weight:600;line-height:1.3}
.profile-prog-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.profile-day{font-size:11px;color:var(--muted)}
.profile-pct{font-size:11px;font-weight:700;color:var(--accent)}

/* Nav */
.nav-label{font-size:10px;font-weight:600;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-bottom:6px;padding-left:6px}
.nav-items{display:flex;flex-direction:column;gap:4px;flex:1}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:10px;font-size:14px;font-weight:500;cursor:pointer;transition:all .15s ease;color:var(--muted);white-space:nowrap;user-select:none;border:none;background:transparent;width:100%;font-family:var(--font-ui)}
.nav-item:hover{background:var(--surface-2);color:var(--primary)}
.nav-item.active{background:var(--primary);color:white;border-left:3px solid var(--accent-warm);padding-left:11px}
.nav-item svg{flex-shrink:0}
.nav-badge{margin-left:auto;border-radius:999px;font-size:10px;font-weight:700;padding:1px 6px}
.nav-ai-badge{background:var(--accent-warm);color:white}
.nav-notif-badge{background:var(--accent-warm);color:white}

/* Sidebar bottom */
.sidebar-bottom{border-top:1.5px solid var(--border);padding-top:16px;display:flex;flex-direction:column;gap:4px}

/* Buttons */
.btn{font-family:var(--font-ui);font-weight:500;font-size:14px;border:none;cursor:pointer;transition:all .18s ease;display:inline-flex;align-items:center;gap:6px;text-decoration:none}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--primary);color:white;padding:10px 20px;border-radius:10px}
.btn-primary:hover{background:#1a3838}
.btn-accent{background:var(--accent);color:white;padding:10px 20px;border-radius:10px}
.btn-accent:hover{background:#4a9996;box-shadow:0 4px 16px rgba(95,179,175,.35)}
.btn-ghost{background:transparent;color:var(--primary);padding:8px 16px;border-radius:8px;border:none}
.btn-ghost:hover{background:var(--surface-2)}
.btn-outline{background:transparent;color:var(--primary);padding:9px 18px;border-radius:10px;border:1.5px solid var(--border)}
.btn-outline:hover{border-color:var(--primary)}
.btn-sm{padding:7px 14px;font-size:12px;border-radius:8px}
.btn-xs{padding:5px 10px;font-size:11px;border-radius:7px}
.btn-full{width:100%;justify-content:center}

/* Cards */
.card{background:var(--surface);border-radius:var(--r);border:1.5px solid var(--border);box-shadow:var(--shadow-sm)}
.metric-card{background:var(--surface);border-radius:var(--r);padding:24px;border:1.5px solid var(--border);box-shadow:var(--shadow-sm);transition:box-shadow .2s ease}
.metric-card:hover{box-shadow:var(--shadow-md)}
.hover-lift{transition:transform .2s ease,box-shadow .2s ease}
.hover-lift:hover{transform:translateY(-2px);box-shadow:var(--shadow-md)}

/* Tags & Badges */
.tag{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:500}
.tag-accent{background:var(--accent-light);color:var(--accent)}
.tag-warm{background:var(--accent-warm-light);color:var(--accent-warm)}
.tag-success{background:var(--success-light);color:var(--success)}
.tag-warning{background:var(--warning-light);color:var(--warning)}
.tag-muted{background:var(--surface-2);color:var(--muted)}
.status-badge{padding:3px 10px;border-radius:999px;font-size:11px;font-weight:600}
.status-on-track{background:var(--success-light);color:var(--success)}
.status-at-risk{background:var(--warning-light);color:var(--warning)}
.chip{display:inline-flex;align-items:center;gap:5px;padding:5px 12px;border-radius:999px;font-size:12px;font-weight:500;border:1.5px solid var(--border);background:var(--surface)}

/* Avatar */
.avatar{border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:600;flex-shrink:0}

/* Progress */
.prog-track{background:var(--border);border-radius:999px;overflow:hidden}
.prog-fill{border-radius:999px;transition:width .6s cubic-bezier(.34,1.56,.64,1)}

/* Animations */
.fade-in{animation:fadeIn .35s ease forwards}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.pulse-dot{animation:pulseDot 2s ease-in-out infinite}
@keyframes pulseDot{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.6;transform:scale(.8)}}
@keyframes typingDot{0%,80%,100%{opacity:.3;transform:scale(.8)}40%{opacity:1;transform:scale(1)}}
.typing-dot{width:7px;height:7px;border-radius:50%;background:var(--muted);display:inline-block}
.typing-dot:nth-child(1){animation:typingDot 1.2s ease .0s infinite}
.typing-dot:nth-child(2){animation:typingDot 1.2s ease .2s infinite}
.typing-dot:nth-child(3){animation:typingDot 1.2s ease .4s infinite}

/* Page headers */
.page-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:32px;flex-wrap:wrap;gap:16px}
.page-title{font-family:var(--font-d);font-size:32px;font-weight:700;letter-spacing:-.3px;line-height:1.2}
.page-subtitle{font-size:14px;color:var(--muted);margin-top:4px}
.page-actions{display:flex;gap:10px;align-items:center}

/* Grid utilities */
.grid-4{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:16px}
.grid-2-col{display:grid;grid-template-columns:1fr 340px;gap:20px}
.grid-people{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.flex{display:flex}.flex-col{flex-direction:column}.gap-8{gap:8px}.gap-10{gap:10px}.gap-12{gap:12px}.gap-16{gap:16px}.gap-20{gap:20px}.gap-24{gap:24px}.gap-28{gap:28px}
.items-center{align-items:center}.items-start{align-items:flex-start}.justify-between{justify-content:space-between}.flex-1{flex:1}.flex-wrap{flex-wrap:wrap}
.mt-4{margin-top:4px}.mt-6{margin-top:6px}.mt-8{margin-top:8px}.mt-10{margin-top:10px}.mt-12{margin-top:12px}.mt-14{margin-top:14px}.mt-16{margin-top:16px}.mt-20{margin-top:20px}.mt-24{margin-top:24px}
.mb-4{margin-bottom:4px}.mb-6{margin-bottom:6px}.mb-8{margin-bottom:8px}.mb-10{margin-bottom:10px}.mb-12{margin-bottom:12px}.mb-14{margin-bottom:14px}.mb-16{margin-bottom:16px}.mb-20{margin-bottom:20px}.mb-24{margin-bottom:24px}.mb-28{margin-bottom:28px}.mb-32{margin-bottom:32px}
.p-20{padding:20px}.p-24{padding:24px}.p-28{padding:28px}
.text-sm{font-size:12px}.text-xs{font-size:11px}.text-base{font-size:14px}.text-muted{color:var(--muted)}.text-accent{color:var(--accent)}.fw-500{font-weight:500}.fw-600{font-weight:600}
.w-full{width:100%}.relative{position:relative}

/* Hero */
.hero{background:var(--primary);border-radius:20px;padding:32px 36px;position:relative;overflow:hidden;background-image:radial-gradient(ellipse at 80% 50%,#1a4a48 0%,var(--primary) 60%)}
.hero-deco1{position:absolute;top:-40px;right:-40px;width:200px;height:200px;border-radius:50%;background:rgba(95,179,175,.18)}
.hero-deco2{position:absolute;bottom:-60px;right:80px;width:150px;height:150px;border-radius:50%;background:rgba(253,165,93,.12)}
.hero-inner{display:flex;justify-content:space-between;align-items:flex-start;position:relative}
.hero-eyebrow{font-size:13px;color:rgba(255,255,255,.5);margin-bottom:6px}
.hero-title{font-family:var(--font-d);font-size:36px;font-weight:700;color:white;line-height:1.2;margin-bottom:8px;letter-spacing:-.3px}
.hero-sub{font-size:14px;color:rgba(255,255,255,.6);margin-bottom:24px}
.hero-btn-ghost{background:rgba(255,255,255,.1);color:white;padding:9px 18px;border-radius:10px;backdrop-filter:blur(10px);border:1.5px solid rgba(255,255,255,.2);font-size:13px;font-weight:500}
.hero-btn-ghost:hover{background:rgba(255,255,255,.2)}

/* Ring */
.ring-wrap{position:relative;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.ring-label{position:absolute;text-align:center}
.ring-value{font-size:22px;font-weight:700;color:white}
.ring-sub{font-size:10px;color:rgba(255,255,255,.5)}

/* Journey */
.phase-tabs{display:flex;gap:10px;margin-bottom:32px;flex-wrap:wrap}
.phase-tab{display:flex;align-items:center;gap:7px;padding:10px 20px;border-radius:12px;font-size:13px;font-weight:500;cursor:pointer;transition:all .2s ease;border:2px solid var(--border);background:var(--surface);color:var(--muted);font-family:var(--font-ui)}
.phase-tab.locked{opacity:.5}
.journey-node{display:flex;align-items:flex-start;gap:16px;position:relative}
.journey-node:not(:last-child)::before{content:'';position:absolute;left:15px;top:36px;width:2px;height:calc(100% - 8px);background:var(--border)}
.journey-node-icon{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;z-index:1;font-size:11px;font-weight:600}
.journey-node-active{padding:8px 12px;border-radius:8px;font-size:12px;font-weight:500;margin-top:8px}

/* Milestones */
.milestone-row{display:flex;align-items:center;gap:12px;padding:10px 0}
.milestone-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.milestone-label{font-size:13px;font-weight:500}
.milestone-date{font-size:11px;color:var(--muted)}
.milestone-days{font-size:11px;font-weight:600}

/* People */
.people-progress-bar{display:flex;align-items:center;gap:32px;flex-wrap:wrap}
.people-stats{display:flex;align-items:center;gap:16px}
.people-stats-value{font-size:22px;font-family:var(--font-d);font-weight:600}
.people-stats-sub{font-size:13px;color:var(--muted)}
.divider-v{width:1px;height:48px;background:var(--border)}
.person-card{padding:20px;cursor:pointer}
.person-card-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:14px}
.person-card-info{display:flex;align-items:center;gap:12px}
.person-name{font-size:14px;font-weight:600}
.person-role{font-size:12px;color:var(--muted)}

/* Chat */
.chat-wrap{display:flex;flex-direction:column;height:calc(100vh - 120px)}
.chat-header{display:flex;align-items:center;gap:14px;margin-bottom:20px;flex-shrink:0}
.aria-avatar{width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,#5fb3af 0%,#fda55d 100%);display:flex;align-items:center;justify-content:center;position:relative;flex-shrink:0}
.online-dot{position:absolute;bottom:2px;right:2px;width:10px;height:10px;background:var(--success);border-radius:50%;border:2px solid var(--surface)}
.chat-messages{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:16px;padding-right:4px;padding-bottom:8px}
.chat-row{display:flex;align-items:flex-end;gap:10px}
.chat-row.user{flex-direction:row-reverse}
.chat-bubble{max-width:75%;padding:12px 16px;border-radius:16px;font-size:14px;line-height:1.6}
.chat-bubble.user{background:var(--primary);color:white;border-bottom-right-radius:4px}
.chat-bubble.ai{background:var(--surface);border:1.5px solid var(--border);border-bottom-left-radius:4px;color:var(--primary)}
.chat-msg-avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#5fb3af 0%,#fda55d 100%);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.chat-starters{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;flex-shrink:0}
.chat-input-row{flex-shrink:0;margin-top:12px;display:flex;gap:10px;align-items:flex-end}
.chat-textarea{width:100%;padding:12px 16px;resize:none;line-height:1.5;font-size:14px;font-family:var(--font-ui);background:var(--surface);color:var(--primary);border:1.5px solid var(--border);border-radius:10px;outline:none;transition:border-color .18s ease,box-shadow .18s ease}
.chat-textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(95,179,175,.1)}
.chat-send{padding:14px 18px;border-radius:12px;flex-shrink:0}
.aria-tip{margin-top:16px;padding:12px 16px;border-radius:12px;background:var(--accent-light);display:flex;align-items:center;gap:12px}
.aria-dark-tip{padding:16px;background:linear-gradient(135deg,var(--primary) 0%,#1a4a48 100%);border-radius:14px}

/* Admin table */
.table-header{display:grid;grid-template-columns:2fr 1fr 80px 100px 80px;gap:16px;padding:8px 0;border-bottom:1.5px solid var(--border);margin-bottom:8px}
.table-row{display:grid;grid-template-columns:2fr 1fr 80px 100px 80px;gap:16px;padding:14px 0;align-items:center}
.table-row:not(:last-child){border-bottom:1px solid var(--border)}
.table-col-label{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}

/* Support circle */
.support-person{display:flex;align-items:center;gap:12px;padding:10px 0}
.support-person:not(:last-child){border-bottom:1px solid var(--border)}

/* Chart area */
.chart-container{width:100%;overflow:hidden}

/* Responsive */
@media(max-width:768px){
  #sidebar{display:none}
  #main{padding:20px 16px 80px}
  .grid-2-col{grid-template-columns:1fr}
  .hero-inner{flex-direction:column;gap:20px}
  .hero-title{font-size:28px}
  .grid-4{grid-template-columns:repeat(2,1fr)}
  #mobile-nav{display:flex!important}
}
#mobile-nav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:100;background:var(--surface);border-top:1.5px solid var(--border);padding:10px 8px;gap:4px;justify-content:space-around}
.mob-nav-btn{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 12px;border-radius:10px;border:none;background:transparent;cursor:pointer;font-family:var(--font-ui);font-size:10px;font-weight:500;color:var(--muted);transition:all .15s ease}
.mob-nav-btn.active{background:var(--primary);color:white}

/* Phase progress mini */
.phase-prog-row{margin-bottom:12px}
.phase-prog-label{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
</style>
</head>

function avatar(initials, color, size=36) {
  return `<div class="avatar" style="width:${size}px;height:${size}px;background:${color}20;color:${color};font-size:${Math.round(size*0.36)}px">${initials}</div>`;
}
function progressBar(value, color='var(--accent)', height=6, style='') {
  return `<div class="prog-track" style="height:${height}px;${style}"><div class="prog-fill" style="width:${value}%;height:100%;background:${color}"></div></div>`;
}
function svgRing(value, size=100, stroke=8, color='var(--accent)', textColor='white') {
  const r = (size - stroke) / 2;
  const circ = 2 * Math.PI * r;
  const offset = circ - (value / 100) * circ;
  return `<svg width="${size}" height="${size}" style="transform:rotate(-90deg)">
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--border)" stroke-width="${stroke}"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}" stroke-dasharray="${circ}" stroke-dashoffset="${offset}" stroke-linecap="round"/>
  </svg>`;
}
function svgLineChart(data, width, height, color, fillColor) {
  if (!data || data.length < 2) return '';
  const minV = Math.min(...data), maxV = Math.max(...data);
  const pad = 4;
  const pts = data.map((v, i) => {
    const x = pad + (i / (data.length - 1)) * (width - pad * 2);
    const y = height - pad - ((v - minV) / (maxV - minV || 1)) * (height - pad * 2);
    return [x, y];
  });
  const linePath = pts.map((p, i) => (i === 0 ? `M${p[0]},${p[1]}` : `L${p[0]},${p[1]}`)).join(' ');
  const fillPath = linePath + ` L${pts[pts.length-1][0]},${height} L${pts[0][0]},${height} Z`;
  return `<svg width="100%" viewBox="0 0 ${width} ${height}" preserveAspectRatio="none" style="display:block">
    <defs><linearGradient id="grad_${color.replace('#','')}" x1="0" y1="0" x2="0" y2="1"><stop offset="5%" stop-color="${color}" stop-opacity="0.2"/><stop offset="95%" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>
    <path d="${fillPath}" fill="url(#grad_${color.replace('#','')})" />
    <path d="${linePath}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>`;
}

// ─── ROUTER ───────────────────────────────────────────────────────────────────
function navigate(view) {
  currentView = view;
  // Update nav
  document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.mob-nav-btn').forEach(el => el.classList.remove('active'));
  const navBtns = document.querySelectorAll('.nav-item');
  const views = ['dashboard','journey','people','chat','admin'];
  const idx = views.indexOf(view);
  if (navBtns[idx]) navBtns[idx].classList.add('active');
  // Mobile
  const mobBtns = document.querySelectorAll('.mob-nav-btn');
  const mobIdx = ['dashboard','journey','chat','admin'].indexOf(view);
  if (mobBtns[mobIdx]) mobBtns[mobIdx].classList.add('active');
  // Render
  render();
}

function setPhase(i) {
  activePhase = i;
  render();
  setTimeout(() => { const tabs = document.querySelectorAll('.phase-tab'); if(tabs[i]) tabs[i].scrollIntoView({behavior:'smooth',block:'nearest'}); }, 50);
}

function setPeopleFilter(f) {
  peopleFilter = f;
  render();
}

// ─── CHAT ─────────────────────────────────────────────────────────────────────
async function sendChat(text, btn) {
  if (!text || chatLoading) return;
  if (btn) { document.querySelector('.chat-starters')?.remove(); }
  chatMessages.push({ role:'user', text: text.replace(/</g,'&lt;') });
  chatLoading = true;
  renderChatOnly();
  scrollChat();

  const systemPrompt = `You are Aria, an expert AI onboarding buddy inside the OnboardHero platform.
You are helping Alexandra Chen ("Alex"), a Senior Product Designer at Meridian Labs, on Day 19 of her 90-day onboarding.
Her manager is Jordan Park (VP of Product), her buddy is Priya Mehta (Product Designer).
She's 67% through onboarding. Current phase: "Connect" (Week 3-4).
Department: Product. She has met 7 of 12 key people.
Today's tasks: Design System Deep Dive video, Coffee Chat with Marcus Rivera at 2:30pm, Complete Role Clarity Doc.
Upcoming: 60-Day Review on March 11.
Be concise, warm, and personalized. Use markdown bold with **text** for emphasis. Keep under 180 words.`;

  const apiMessages = chatMessages.filter(m=>m.role!=='ai'||chatMessages.indexOf(m)>0).map(m => ({
    role: m.role === 'ai' ? 'assistant' : 'user',
    content: m.text.replace(/<[^>]+>/g,'').replace(/&lt;/g,'<')
  }));

  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ model:'claude-sonnet-4-20250514', max_tokens:1000, system:systemPrompt, messages:apiMessages })
    });
    const data = await res.json();
    const reply = data.content?.[0]?.text || "Sorry, I couldn't process that. Please try again.";
    chatMessages.push({ role:'ai', text: reply.replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>').replace(/\n/g,'<br>') });
  } catch(e) {
    chatMessages.push({ role:'ai', text: "I'm having trouble connecting right now. Please try again in a moment." });
  }
  chatLoading = false;
  renderChatOnly();
  scrollChat();
}

function submitChat() {
  const input = document.getElementById('chat-input');
  if (!input) return;
  const val = input.value.trim();
  if (!val) return;
  input.value = '';
  sendChat(val);
}

function renderChatOnly() {
  const msgs = document.getElementById('chat-messages');
  if (!msgs) return;
  msgs.innerHTML = chatMessages.map(m => `
    <div class="chat-row ${m.role}">
      ${m.role==='ai' ? `<div class="chat-msg-avatar"><span style="color:white">${I.aria}</span></div>` : `<div class="avatar" style="width:32px;height:32px;background:#5fb3af20;color:#5fb3af;font-size:12px">AC</div>`}
      <div class="chat-bubble ${m.role==='ai'?'ai':'user'}">${m.text}</div>
    </div>`).join('') +
    (chatLoading ? `
    <div class="chat-row ai">
      <div class="chat-msg-avatar"><span style="color:white">${I.aria}</span></div>
      <div class="chat-bubble ai" style="display:flex;gap:4px;align-items:center">
        <div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div>
      </div>
    </div>` : '');
}

function scrollChat() {
  setTimeout(() => {
    const msgs = document.getElementById('chat-messages');
    if (msgs) msgs.scrollTop = msgs.scrollHeight;
  }, 50);
}

// ─── RENDER ───────────────────────────────────────────────────────────────────
function render() {
  const main = document.getElementById('main');
  switch(currentView) {
    case 'dashboard': main.innerHTML = viewDashboard(); break;
    case 'journey':   main.innerHTML = viewJourney(); break;
    case 'people':    main.innerHTML = viewPeople(); break;
    case 'chat':      main.innerHTML = viewChat(); scrollChat(); break;
    case 'admin':     main.innerHTML = viewAdmin(); break;
  }
}

// Boot
render();
</script>
